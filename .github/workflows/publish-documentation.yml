name: Publish documentation

on:
  push:
    branches:
      - master
    paths:
      - docs2/**
      - .github/workflows/publish-documentation.yml

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: main
      - name: Checkout publish target
        uses: actions/checkout@v7
        with:
          repository: graphql-dotnet/graphql-dotnet.github.io
          token: ${{ secrets.ORG_PAT_TOKEN }}
          path: published
      - name: Use Node.js from docs2/package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: main/docs2/package.json
      - name: npm ci docs2
        working-directory: main/docs2
        run: npm ci
      - name: npm run build
        working-directory: main/docs2
        run: npm run build
      - name: Publish docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Documentation
          path: main/docs2/dist/**
          if-no-files-found: error
          include-hidden-files: true
      - name: Commit docs
        shell: bash
        run: |
          rsync -a --quiet --delete --exclude ".git" "main/docs2/dist/" "published/" || exit 1
          cd published
          git config user.name github-actions
          git config user.email github-actions@graphql-dotnet.net
          git add --all

          err=$(git status 2>&1)
          str="nothing to commit, working tree clean"
          if [[ "$err" == *"$str"* ]]; then
            echo "Documentation files are up to date, nothing to commit/push"
          else
            git commit -a -m "Documentation update"
            git push
          fi
