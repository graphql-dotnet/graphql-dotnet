name: Build artifacts

# ==== NOTE: do not rename this yml file or the run_number will be reset ====

on:
  push:
    branches:
      - master
      - develop
    paths:
      - src/**
      - samples/**
      - .github/workflows/**
      - '*'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js from docs2/package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: docs2/package.json
      - name: npm ci docs2
        working-directory: docs2
        run: npm ci
      - name: npm run build
        working-directory: docs2
        run: npm run build
      - name: Publish docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Documentation
          path: docs2/dist/**
          if-no-files-found: error
          include-hidden-files: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/graphql-dotnet/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Install dependencies
        working-directory: .
        run: dotnet restore
      - name: Build solution [Release]
        working-directory: .
        run: dotnet build --no-restore -c Release -p:VersionSuffix=$GITHUB_RUN_NUMBER
      - name: Pack solution [Release]
        working-directory: .
        run: dotnet pack --no-restore --no-build -c Release -p:VersionSuffix=$GITHUB_RUN_NUMBER -o src/out
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Nuget packages
          path: |
            src/out/*
      - name: Publish Nuget packages to GitHub registry
        working-directory: src
        run: dotnet nuget push "out/*" -k ${{secrets.GITHUB_TOKEN}}
